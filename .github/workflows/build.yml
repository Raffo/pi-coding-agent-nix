name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install stable Nix (no flakes)
        run: |
          curl --fail --silent --show-error --location https://nixos.org/nix/install -o /tmp/install-nix
          sh /tmp/install-nix --no-daemon --yes
      - name: Test updater and build package
        run: |
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          python3 -m unittest discover -s tests -v
          nix-build --option experimental-features ''
          ./result/bin/pi --version
